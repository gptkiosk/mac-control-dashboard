name: draft release (macOS arm64)

# DRAFT. Builds the macOS package from the pushed tag, signs its manifest and creates a DRAFT release
# whose notes come from CHANGELOG.md. A person reviews the draft and presses Publish.
#
# It cannot sign until the operator creates the release signing key and stores its private half as the
# repository secret RELEASE_SSH_PRIVATE_KEY (punchlist N9; agents never handle that key). Until then the
# "sign" job fails on purpose, before anything is attested or published, and no release is created.
#
# A tag that already has a release (the plain release made by scripts/release/publish-release.sh
# without --package) is left alone: the first job says so and the rest are skipped.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to build
        required: true
        type: string
        default: v0.3.1
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: mcd-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: skip tags that already have a release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "A release for $TAG already exists; this workflow never alters a release. Nothing to build." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build from clean committed source
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: macos-14
    timeout-minutes: 45
    outputs:
      archive: ${{ steps.assets.outputs.archive }}
      manifest: ${{ steps.assets.outputs.manifest }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the pushed tag without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up packaged Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Set up locked web build runtime
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Check clean source, tag/version agreement and the changelog
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test -z "$(git status --porcelain --untracked-files=all)"
          version="$(python3 -I -c 'import ast; p="apps/api/version.py"; t=ast.parse(open(p).read()); print(next(ast.literal_eval(n.value) for n in t.body if isinstance(n, ast.Assign) and any(isinstance(x, ast.Name) and x.id == "__version__" for x in n.targets)))')"
          test "${TAG}" = "v${version}"
          python3 -I scripts/release/changelog.py check "${version}"
          python3 -I scripts/release/changelog.py notes "${version}" --repo "${GITHUB_REPOSITORY}" > "$RUNNER_TEMP/release-notes.md"
      - name: Build deterministic release
        run: scripts/release/build-macos-arm64.sh --out dist-release --repro
      - name: Verify and identify the package assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist-release/mcd-*-darwin-arm64.tar.gz)
          manifests=(dist-release/mcd-*-darwin-arm64.manifest.json)
          test "${#archives[@]}" -eq 1
          test "${#manifests[@]}" -eq 1
          archive="${archives[0]}"; manifest="${manifests[0]}"
          python3 -I scripts/release/release.py verify "$manifest" --artifact "$archive" --expect-version "${TAG#v}" --expect-product mcd --expect-platform darwin-arm64
          printf 'archive=%s\nmanifest=%s\n' "$archive" "$manifest" >> "$GITHUB_OUTPUT"
      - name: Pass the verified package to the signing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-release-package
          path: |
            ${{ steps.assets.outputs.archive }}
            ${{ steps.assets.outputs.manifest }}
          if-no-files-found: error
          retention-days: 1
      - name: Pass the release notes on
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 1

  sign-and-attest:
    name: sign and attest verified package
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download the package from the build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unsigned-release-package
          path: dist-release
      - name: Sign the detached manifest
        shell: bash
        env:
          RELEASE_SSH_PRIVATE_KEY: ${{ secrets.RELEASE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_SSH_PRIVATE_KEY:-}" || { echo "RELEASE_SSH_PRIVATE_KEY is intentionally unset until the operator creates the release signing key (punchlist N9). Nothing was signed, attested or published." >&2; exit 1; }
          manifest="$(find dist-release -maxdepth 1 -name '*.manifest.json' -type f)"
          test -n "$manifest"
          key="$RUNNER_TEMP/release-signing-key"
          umask 077
          printf '%s\n' "$RELEASE_SSH_PRIVATE_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          ssh-keygen -y -f "$key" >/dev/null
          ssh-keygen -Y sign -f "$key" -n dashboard-release "$manifest"
          test -s "${manifest}.sig"
      - name: Write checksums for the allowlisted assets
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find dist-release -maxdepth 1 -name '*.tar.gz' -type f)"
          manifest="$(find dist-release -maxdepth 1 -name '*.manifest.json' -type f)"
          signature="${manifest}.sig"
          test -f "$archive" && test -f "$manifest" && test -f "$signature"
          (cd dist-release && sha256sum "$(basename "$archive")" "$(basename "$manifest")" "$(basename "$signature")" > SHA256SUMS)
          test "$(wc -l < dist-release/SHA256SUMS | tr -d ' ')" = 3
          test "$(find dist-release -maxdepth 1 -type f | wc -l | tr -d ' ')" = 4
      - name: Attest the four allowlisted assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            dist-release/*.tar.gz
            dist-release/*.manifest.json
            dist-release/*.manifest.json.sig
            dist-release/SHA256SUMS
      - name: Pass the signed assets to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-release-assets
          path: dist-release/*
          if-no-files-found: error
          retention-days: 1

  publish-draft:
    name: create draft release
    needs: sign-and-attest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the signed release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-release-assets
          path: dist-release
      - name: Download the release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-notes
          path: notes
      - name: Create a draft release with only the allowlisted assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && { echo "refusing to alter an existing release for $TAG" >&2; exit 1; }
          manifest="$(find dist-release -maxdepth 1 -name '*.manifest.json' -type f)"
          digest="$(sha256sum "$manifest" | cut -d' ' -f1)"
          {
            cat notes/release-notes.md
            printf '\n---\n\nManifest SHA-256 (paste this into Settings, Updates, when the dashboard asks for it):\n\n`%s`\n' "$digest"
          } > release-body.md
          flags=(--draft --title "$TAG" --notes-file release-body.md)
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" dist-release/*
