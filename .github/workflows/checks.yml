name: Application checks
# Diagnostic branch only. Not a proposed change to the release gates.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-diagnostics:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/api/requirements.lock.txt
      - run: python -m pytest apps/api/tests/test_project_preview.py -q
