version: 2

updates:
  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: scope
  - package-ecosystem: pip
    directory: "/apps/api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: scope
  - package-ecosystem: pip
    directory: "/apps/mcp"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: scope
  # The pinned tool installs under apps/api/tool_locks are not listed here on
  # purpose. Each lock file is guarded by a hash in apps/api/tool_catalog.json,
  # which Dependabot cannot update, so its pull requests there always fail the
  # api suite. Bump those with scripts/tools/check.py --apply instead.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: scope
